<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS HUD Interface</title>
    <style>
        :root {
            --glow-color: #00f3ff;
            --bg-dark: #070b19;
            --hud-transparency: rgba(0, 243, 255, 0.15);
            --font-hud: 'Courier New', Courier, monospace;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--glow-color);
            font-family: var(--font-hud);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-shadow: 0 0 10px var(--glow-color);
        }

        /* Hintergrundmuster */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--hud-transparency) 1px, transparent 1px),
                linear-gradient(90deg, var(--hud-transparency) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 1;
        }

        /* Hauptcontainer */
        .main-frame {
            position: relative;
            width: 80%;
            max-width: 800px;
            height: 60vh;
            border: 2px solid var(--glow-color);
            box-shadow: 0 0 20px var(--glow-color), inset 0 0 20px var(--glow-color);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(7, 11, 25, 0.8);
            z-index: 2;
        }

        /* Ecken-Dekoration */
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--glow-color);
        }
        .top-left { top: -5px; left: -5px; border-right: none; border-bottom: none; }
        .top-right { top: -5px; right: -5px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: -5px; left: -5px; border-right: none; border-top: none; }
        .bottom-right { bottom: -5px; right: -5px; border-left: none; border-top: none; }

        header {
            font-size: 2rem;
            text-align: center;
            letter-spacing: 5px;
            border-bottom: 2px solid var(--glow-color);
            padding-bottom: 15px;
        }

        .output-console {
            flex-grow: 1;
            margin: 20px 0;
            overflow-y: auto;
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 15px;
            background: rgba(0, 243, 255, 0.05);
            min-height: 150px;
        }

        .input-area {
            display: flex;
            gap: 15px;
            border-top: 2px solid var(--glow-color);
            padding-top: 15px;
            flex-direction: column;
        }

        input[type="password"], input[type="text"] {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--glow-color);
            color: var(--glow-color);
            padding: 10px;
            font-family: var(--font-hud);
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        .command-bar {
            display: flex;
            gap: 15px;
        }

        button {
            background: var(--glow-color);
            color: var(--bg-dark);
            border: none;
            padding: 10px 20px;
            font-family: var(--font-hud);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 10px var(--glow-color);
        }

        button:hover {
            background: #00c9d4;
            box-shadow: 0 0 20px var(--glow-color);
        }

        /* Pulsierender Text für Status */
        .status {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div class="hud-overlay"></div>

    <div class="main-frame">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <header>JARVIS O.S.</header>

        <div class="output-console">
            <p class="status">> Systeminitialisierung abgeschlossen...</p>
            <p class="status">> Bereit für Sprach- oder Texteingabe.</p>
            <div id="response-display"></div>
        </div>

        <div class="input-area">
            <input type="password" id="api-key" placeholder="Groq API-Schlüssel eingeben...">
            <div class="command-bar">
                <input type="text" id="user-input" placeholder="Befehl eingeben...">
                <button onclick="processCommand()">SENDEN</button>
            </div>
        </div>
    </div>

    <script>
        async function processCommand() {
            const apiKey = document.getElementById('api-key').value;
            const input = document.getElementById('user-input').value;
            const display = document.getElementById('response-display');

            if (!apiKey) {
                alert("Bitte gib zuerst deinen API-Schlüssel ein.");
                return;
            }

            if (input.trim() !== '') {
                display.innerHTML += `<p>> ${input}</p>`;
                document.getElementById('user-input').value = '';
                
                display.innerHTML += `<p id="loading">> Jarvis denkt nach...</p>`;
                const loadingElement = document.getElementById('loading');

                try {
                    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: 'llama-3.3-70b-versatile',
                            messages: [
                                { role: 'system', content: 'Du bist Jarvis, ein intelligentes System, das in einem Iron-Man-Stil antwortet.' },
                                { role: 'user', content: input }
                            ]
                        })
                    });

                    const data = await response.json();
                    loadingElement.remove();

                    if (data.choices && data.choices.length > 0) {
                        const reply = data.choices[0].message.content;
                        display.innerHTML += `<p style="color:white">> ${reply}</p>`;
                    } else if (data.error) {
                        display.innerHTML += `<p style="color:red">> Fehler: ${data.error.message}</p>`;
                    }
                } catch (error) {
                    loadingElement.remove();
                    display.innerHTML += `<p style="color:red">> Verbindungsfehler: ${error.message}</p>`;
                }

                const consoleElement = document.querySelector('.output-console');
                consoleElement.scrollTop = consoleElement.scrollHeight;
            }
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                processCommand();
            }
        });
    </script>
</body>
</html>
